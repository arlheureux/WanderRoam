name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev
      
      - name: Bump version in backend
        id: bump
        run: |
          cd backend
          npm version ${{ github.event.inputs.bump_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
      
      - name: Update frontend version
        run: |
          VERSION=${{ steps.bump.outputs.NEW_VERSION }}
          echo "export const VERSION = '$VERSION';" > frontend/src/version.js
          echo "export const GIT_COMMIT = process.env.REACT_APP_GIT_COMMIT || 'unknown';" >> frontend/src/version.js
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add backend/package.json frontend/src/version.js
          git commit -m "chore: bump version to ${{ steps.bump.outputs.NEW_VERSION }}"
          git push origin dev
      
      - name: Create and push tag
        run: |
          git tag "v${{ steps.bump.outputs.NEW_VERSION }}"
          git push origin "v${{ steps.bump.outputs.NEW_VERSION }}"
