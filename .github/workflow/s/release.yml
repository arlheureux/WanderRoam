name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g., v0.7.2)'
        required: true
        default: ''

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set tag from input or ref
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Verify version matches package.json
        if: startsWith(steps.tag.outputs.TAG, 'v')
        run: |
          TAG_VERSION=${TAG#v}
          PKG_VERSION=$(node -p "require('./backend/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Tag version ($TAG) doesn't match package.json ($PKG_VERSION)"
            exit 1
          fi
        env:
          TAG: ${{ steps.tag.outputs.TAG }}
      
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          fi
          
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: WanderRoam ${{ steps.tag.outputs.TAG }}
          body: |
            ## Docker Images
            
            ```bash
            docker pull arlheureux/wanderroam-backend:${{ steps.tag.outputs.TAG }}
            docker pull arlheureux/wanderroam-frontend:${{ steps.tag.outputs.TAG }}
            docker pull arlheureux/wanderroam-admin:${{ steps.tag.outputs.TAG }}
            ```
            
            ## Changes
            
            ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.TAG, 'alpha') || contains(steps.tag.outputs.TAG, 'beta') || contains(steps.tag.outputs.TAG, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
